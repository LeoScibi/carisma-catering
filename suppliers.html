<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Carisma Ops — Suppliers</title>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="app-header">
  <div class="brand">Carisma <span>Ops</span></div>
  <nav class="app-nav">
    <a href="index.html">Dashboard</a>
    <a href="ingredients.html">Ingredients</a>
    <a href="suppliers.html" class="active">Suppliers</a>
    <a href="supplier-ingredients.html">Supplier Prices</a>
    <a href="recipes.html">Recipes</a>
    <a href="setup.html">Setup</a>
  </nav>
</header>

<main>
  <h1>Suppliers</h1>
  <p class="sub">Your list of suppliers. Prices per ingredient are set on the <a href="supplier-ingredients.html">Supplier Prices</a> page, not here.</p>

  <div id="signedOutNotice" class="card" style="display:none;">
    <span class="badge off">Not signed in</span>
    <p style="font-size:13px; color:var(--muted); margin-bottom:0;">Go to the <a href="index.html">Dashboard</a> to sign in — your session will carry over here.</p>
  </div>

  <div class="card" id="formCard" style="display:none;">
    <h2 style="margin-top:0;">Add supplier</h2>
    <form id="addForm">
      <div class="field-row">
        <div><label style="margin-top:0;">Name *</label><input id="f_name" required></div>
        <div><label style="margin-top:0;">Contact</label><input id="f_contact" placeholder="Phone, email, or account manager"></div>
      </div>
      <label>Notes</label>
      <textarea id="f_notes"></textarea>
      <button type="submit" id="addBtn">Add supplier</button>
      <button type="button" id="reloadBtn" class="secondary">Reload list</button>
    </form>
    <div id="status" class="status-line"></div>
  </div>

  <h2>All suppliers</h2>
  <table id="rowsTable" style="display:none;">
    <thead><tr id="tableHead"></tr></thead>
    <tbody id="tableBody"></tbody>
  </table>
</main>

<script src="js/config.js"></script>
<script src="js/sheets.js"></script>
<script src="js/units.js"></script>
<script>
  const RANGE = 'Suppliers!A:D';
  const HEADERS = ['ID','NAME','CONTACT','NOTES'];

  const status = document.getElementById('status');
  let token = null;

  function setStatus(msg, kind) {
    status.textContent = msg;
    status.className = 'status-line' + (kind ? ' ' + kind : '');
  }

  function requireAuth() {
    const cfg = getStoredConfig();
    token = tryResumeSession();
    if (!token || !cfg.spreadsheetId) {
      document.getElementById('signedOutNotice').style.display = 'block';
      document.getElementById('formCard').style.display = 'none';
      return false;
    }
    document.getElementById('signedOutNotice').style.display = 'none';
    document.getElementById('formCard').style.display = 'block';
    return true;
  }

  async function loadRows() {
    const cfg = getStoredConfig();
    setStatus('Loading...');
    try {
      const rows = await sheetsGet(cfg.spreadsheetId, RANGE, token);
      renderTable(rows.length ? rows : [HEADERS]);
      setStatus(`Loaded ${Math.max(rows.length - 1, 0)} supplier(s).`, 'ok');
    } catch (err) {
      setStatus('Error loading: ' + err.message, 'error');
    }
  }

  function renderTable(rows) {
    const table = document.getElementById('rowsTable');
    const head = document.getElementById('tableHead');
    const body = document.getElementById('tableBody');
    if (!rows.length || rows.length < 2) { table.style.display = 'none'; return; }
    const [header, ...rest] = rows;
    head.innerHTML = header.map(h => `<th>${h}</th>`).join('');
    body.innerHTML = rest.map(r =>
      '<tr>' + header.map((_, i) => `<td>${r[i] ?? ''}</td>`).join('') + '</tr>'
    ).join('');
    table.style.display = 'table';
  }

  document.getElementById('addForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    if (!requireAuth()) return;
    const name = document.getElementById('f_name').value.trim();
    if (!name) { setStatus('Name is required.', 'error'); return; }

    const cfg = getStoredConfig();
    setStatus('Loading current list to assign an ID...');
    try {
      const existing = await sheetsGet(cfg.spreadsheetId, RANGE, token);
      const rows = existing.length ? existing : [HEADERS];
      const id = nextId(rows, 'SUP');
      const row = [
        id,
        name,
        document.getElementById('f_contact').value.trim(),
        document.getElementById('f_notes').value.trim()
      ];
      setStatus('Adding supplier...');
      await sheetsAppend(cfg.spreadsheetId, RANGE, row, token);
      setStatus(`Supplier ${id} added.`, 'ok');
      e.target.reset();
      loadRows();
    } catch (err) {
      setStatus('Error: ' + err.message, 'error');
    }
  });

  document.getElementById('reloadBtn').addEventListener('click', loadRows);

  window.addEventListener('load', () => {
    if (requireAuth()) loadRows();
  });
</script>
</body>
</html>
